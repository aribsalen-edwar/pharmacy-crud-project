<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Rakkas&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>

    <div class="w-75 mx-auto pt-3 text-end">
      <span id="liveDate" class="fw-bold"></span>
      <span id="liveClock" class="fw-bold text-primary ms-2"></span>
    </div>

    <div class="container">
      <div class="w-75 mx-auto py-5">
        <h1 class="mb-5 mt-5">Pharmacy Management Systen</h1>
        <div class="form-group mb-3">
          <label for="productName" class="mb-2 h5">Product Name</label>
          <input
            type="text"
            class="form-control"
            id="productName"
            placeholder="enter name"
          />
        </div>
        <div class="form-group mb-3">
          <label for="productPrice" class="mb-2 h5">Product Price</label>
          <input
            type="number"
            class="form-control"
            id="productPrice"
            placeholder="enter price"
          />
        </div>
        <div class="form-group mb-3">
          <label for="productImage" class="mb-2 h5">Product Image</label>
          <input
            type="file"
            class="form-control"
            id="productImage"
            accept="image/*"
          />
        </div>
        <div class="form-group mb-3">
          <label for="productQuantity" class="mb-2 h5">Product Quantity</label>
          <input
            type="number"
            class="form-control"
            id="productQuantity"
            placeholder="enter quantity"
          />
        </div>
        <div class="form-group mb-3">
          <label for="productDesc" class="mb-2 h5">Product Description</label>
          <textarea
            name="productDesc"
            id="productDesc"
            class="form-control"
          ></textarea>
        </div>
        <button
          onclick="addProduct()"
          class="btn btn-primary btn-larg"
          id="addProductBtn"
        >
          Add Prodect
        </button>
        <button
          onclick="updateProduct()"
          class="btn btn-warning btn-larg d-none"
          id="updateProductBtn"
        >
          Update
        </button>
      </div>
      <div class="w-75 mx-auto py-5">
        <h3>Search by...</h3>
        <div class="d-flex gap-2 flex-wrap">
          <select id="searchField" class="form-select" style="max-width: 180px">
            <option value="name">Name</option>
            <option value="price">Price</option>
            <option value="quantity">Quantity</option>
            <option value="desc">Description</option>
          </select>

          <input
            type="text"
            id="searchInput"
            class="form-control"
            placeholder="Enter search term..."
            oninput="searchProduct(this.value)"
            style="max-width: 300px"
          />
        </div>
      </div>

      <select
        id="sortField"
        class="form-select w-75 container mb-3"
        onchange="sortProduct(this.value)"
      >
        <option value="">Sort by...</option>
        <option value="name-asc">Name (A → Z)</option>
        <option value="name-desc">Name (Z → A)</option>
        <option value="price-asc">Price (Low → High)</option>
        <option value="price-desc">Price (High → Low)</option>
        <option value="quantity-asc">Quantity (Low → High)</option>
        <option value="quantity-desc">Quantity (High → Low)</option>
      </select>

      <table class="table text-white w-75 mx-auto py-5 text-centr text-center">
        <thead>
          <th>Idx</th>
          <th>Img</th>
          <th>Name</th>
          <th>Price</th>
          <th>Qty</th>
          <th>Product Desc</th>
          <th>Update</th>
          <th>Del</th>
          
        </thead>
        <tbody id="tBody"></tbody>
      </table>
    </div>
    <script src="./js/main.js"></script>
  </body>
</html>
